name: Qualidade das correções
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
concurrency:
  group: qualidade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regras-e-preparacao:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Conferir SDK das ferramentas
        run: dotnet --version
      - name: Formatação C#
        run: dotnet format whitespace --folder --verify-no-changes --verbosity minimal
      - name: Sintaxe C# em jogador, Editor e desenvolvimento
        run: dotnet run --project tools/CodeQuality/CodeQuality.csproj --configuration Release
      - name: Preparar análise Python
        run: python -m pip install -r requirements-dev.txt
      - name: Análise estática e formatação Python
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q tools Tests
      - name: Sintaxe PowerShell 7
        run: ./tools/Verificar-Sintaxe.ps1
      - name: Sintaxe Windows PowerShell 5.1
        shell: powershell
        run: ./tools/Verificar-Sintaxe.ps1
      - name: Regressão das regras em C#
        run: dotnet run --project Tests/Core/CoreTests.csproj --configuration Release
      - name: Recuperação em pasta isolada
        run: python Tests/test_preparation.py
      - name: Recuperação após falhas no Windows PowerShell 5.1
        shell: powershell
        env:
          NOX_TEST_POWERSHELL: powershell
        run: |
          $cases = @(
            "PreparationTests.test_updater_restores_partial_write_and_removes_new_files",
            "PreparationTests.test_updater_detects_corruption_and_restores_previous_bytes",
            "PreparationTests.test_updater_leaves_project_untouched_if_backup_fails",
            "PreparationTests.test_updater_reports_partial_recovery_and_keeps_original_error",
            "PreparationTests.test_updater_restores_if_completion_manifest_fails",
            "PreparationTests.test_updater_moves_old_layout_and_preserves_script_guid",
            "PreparationTests.test_updater_rejects_old_path_owned_by_another_guid",
            "PreparationTests.test_updater_restores_deleted_old_paths_when_retirement_fails",
            "PreparationTests.test_updater_removes_known_orphaned_old_meta"
          )
          python Tests/test_preparation.py @cases
      - name: Contratos dos componentes e metadados
        run: python Tests/test_source_contracts.py
      - name: Integridade do personagem e clips FBX
        run: python Tests/test_character_asset.py
      - name: Ciclos das curvas exportadas
        run: python Tests/test_animation_cycles.py
